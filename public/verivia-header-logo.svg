<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 80" width="540" height="80" fill="none">
  <defs>
    <!-- Royal Navy Wing Gradient -->
    <linearGradient id="headerNavyWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08244B"/>
      <stop offset="35%" stop-color="#0B3A75"/>
      <stop offset="70%" stop-color="#0F549E"/>
      <stop offset="100%" stop-color="#092652"/>
    </linearGradient>

    <!-- Navy Wing Shade -->
    <linearGradient id="headerNavyWingShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051833"/>
      <stop offset="100%" stop-color="#0D4386"/>
    </linearGradient>

    <!-- Cyan Figure Gradient -->
    <linearGradient id="headerCyanFigure" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077B6"/>
      <stop offset="30%" stop-color="#0096C7"/>
      <stop offset="70%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#48CAE4"/>
    </linearGradient>

    <!-- Orbit Swoosh Gradient -->
    <linearGradient id="headerCyanOrbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0096C7"/>
      <stop offset="50%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#90E0EF"/>
    </linearGradient>

    <!-- Wave on letter A -->
    <linearGradient id="headerCyanWave" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077B6"/>
      <stop offset="50%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#48CAE4"/>
    </linearGradient>
  </defs>

  <!-- Left Emblem (Iconic V with Vitality Figure, Orbit Swoosh & International Airplane) -->
  <g transform="translate(6, 4) scale(0.338) translate(-305, -45)">
    <!-- Deep Navy Left Wing of 'V' -->
    <path d="M 320 65 
             C 305 68, 298 90, 310 120 
             C 328 165, 375 220, 442 248 
             C 440 215, 428 175, 410 135 
             C 395 102, 380 75, 348 66 Z" 
          fill="url(#headerNavyWing)"/>

    <path d="M 320 65 
             C 314 80, 318 105, 335 140 
             C 358 185, 400 230, 442 248 
             C 434 220, 425 185, 412 150 
             C 395 105, 365 72, 320 65 Z" 
          fill="url(#headerNavyWingShade)" opacity="0.5"/>

    <!-- Cyan Health & Vitality Figure -->
    <circle cx="475" cy="78" r="20" fill="url(#headerCyanFigure)"/>

    <path d="M 470 106 
             C 455 120, 435 138, 420 162 
             C 432 150, 448 135, 465 125 
             C 458 152, 450 195, 442 248 
             C 458 205, 482 152, 510 118 
             C 536 86, 568 62, 595 48 
             C 580 66, 550 102, 526 136 
             C 498 175, 468 220, 442 248 
             C 438 215, 445 160, 452 128 
             C 442 138, 432 150, 420 162 
             C 435 132, 455 115, 470 106 Z" 
          fill="url(#headerCyanFigure)"/>

    <path d="M 465 106
             C 450 120, 430 145, 418 175
             C 430 155, 446 135, 468 122 Z" 
          fill="#00B4D8"/>

    <!-- Orbital Swoosh Ring looping under the V -->
    <path d="M 345 192 
             C 330 205, 338 225, 365 240 
             C 405 258, 475 258, 545 220 
             C 605 186, 642 145, 658 116 
             C 650 128, 612 165, 552 198 
             C 485 234, 418 238, 375 225 
             C 348 216, 342 202, 345 192 Z" 
          fill="url(#headerCyanOrbit)"/>

    <!-- Airplane flying up to top-right -->
    <g transform="translate(658, 102) rotate(-42)">
      <path d="M 0 -22 
               C 3 -22, 5.5 -18, 5.5 -8 
               L 5.5 6 
               L 26 15 
               L 26 21 
               L 5.5 16 
               L 5.5 28 
               L 12 34 
               L 12 38 
               L 0 36 
               L -12 38 
               L -12 34 
               L -5.5 28 
               L -5.5 16 
               L -26 21 
               L -26 15 
               L -5.5 6 
               L -5.5 -8 
               C -5.5 -18, -3 -22, 0 -22 Z" 
            fill="#0A3366"/>
    </g>
  </g>

  <!-- Typography Right Block -->
  <g transform="translate(142, 4)">
    <!-- Top Line: VERIVIA HEALTH -->
    <g transform="translate(0, 28)">
      <!-- VERIVIA in Bold Navy -->
      <text font-family="'Poppins', 'Montserrat', -apple-system, sans-serif" 
            font-weight="900" 
            font-size="33" 
            letter-spacing="2.2" 
            fill="#08284D">
        VERIVIA
      </text>

      <!-- Signature Wave Accent inside letter A -->
      <path d="M 152 -7 
               C 159 -2, 167 -2, 174 -9 
               C 181 -14, 187 -12, 193 -8 
               C 187 -6, 181 -8, 174 -3 
               C 167 2, 159 2, 152 -7 Z" 
            fill="url(#headerCyanWave)"/>

      <!-- HEALTH in Medical Cyan / Sky Blue -->
      <text x="202" y="0" 
            font-family="'Poppins', 'Montserrat', -apple-system, sans-serif" 
            font-weight="800" 
            font-size="28" 
            letter-spacing="4" 
            fill="#0284C7">
        HEALTH
      </text>
    </g>

    <!-- Subtitle: INTERNATIONAL PATIENT SERVICES -->
    <text x="2" y="50" 
          font-family="'Inter', 'Segoe UI', system-ui, sans-serif" 
          font-weight="700" 
          font-size="13" 
          letter-spacing="1.8" 
          fill="#0B5A91">
      INTERNATIONAL PATIENT SERVICES
    </text>

    <!-- Tagline: Bold, Crisp, High-Contrast and Clearly Visible -->
    <text x="2" y="70" 
          font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" 
          font-weight="700" 
          font-size="13.5" 
          letter-spacing="0.2" 
          fill="#08284D">
      Your Global Gateway to Trusted Healthcare in India
    </text>
  </g>
</svg>
